<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project ITS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">

      <header id="topbar">
        <span class="brand">PROJECT_ITS</span>
        <div class="topbar-right">
          <span id="status-indicator" class="status-indicator connecting">
            <span class="status-dot">●</span>
            <span id="status-text">connecting</span>
          </span>
          <div class="model-wrapper">
            <label class="section-label" for="model-select">model</label>
            <select id="model-select" class="model-select" disabled>
              <option value="">loading…</option>
            </select>
          </div>
        </div>
      </header>

      <div id="layout">

        <aside id="sidebar">
          <div class="sidebar-header">
            <span class="section-label">sessions</span>
            <button id="new-chat-btn" class="new-chat-btn" disabled>+ new</button>
          </div>
          <ul id="session-list" class="session-list"></ul>
        </aside>

        <main id="main">
          <div id="chat-area" class="chat-area">

            <div id="empty-state" class="empty-state">
              <pre class="empty-art">
  ╔══════════════╗
  ║  PROJECT_ITS ║
  ║   beta v0.1  ║
  ╚══════════════╝</pre>
              <p class="empty-title">no session active</p>
              <p class="empty-sub">press <kbd>+ new</kbd> to start a chat</p>
            </div>

            <div id="messages" class="messages hidden"></div>

            <div id="thinking" class="thinking hidden">
              <span class="thinking-prefix">&lt;</span>
              <span class="thinking-dots">
                <span class="dot">▋</span>
              </span>
            </div>

          </div>

          <div id="input-bar" class="input-bar">
            <span class="prompt-sign">&gt;</span>
            <textarea
              id="input"
              class="input"
              placeholder="type a message…"
              rows="1"
              disabled
            ></textarea>
            <button id="send-btn" class="send-btn" disabled>send</button>
          </div>
        </main>

      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
